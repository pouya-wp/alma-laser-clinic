server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Allow embedding in Telegram Web App (Desktop, Mobile, Web)
    add_header Access-Control-Allow-Origin * always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://*.telegram.org https://*.t.me;" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Direct APK downloads
    location ~* \.apk$ {
        types {
            application/vnd.android.package-archive apk;
        }
        add_header Content-Disposition 'attachment';
        try_files $uri =404;
    }

    # Proxy API requests to backend container
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Serve static clinic logo
    location /static/logo/ {
        proxy_pass http://backend:4000/static/logo/;
    }
}
